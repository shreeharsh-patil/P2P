<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14080a" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Crimson Red Glow Gradient -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3030" stop-opacity="1" />
      <stop offset="40%" stop-color="#e31e24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b51218" stop-opacity="0" />
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8" />

  <!-- Background Red Atmosphere Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#redGlow)" opacity="0.35" />

  <!-- Technical Corner Accents -->
  <path d="M 72 136 L 72 72 L 136 72" fill="none" stroke="#ff3030" stroke-width="12" stroke-linecap="square" />
  <path d="M 440 136 L 440 72 L 376 72" fill="none" stroke="#ff3030" stroke-width="12" stroke-linecap="square" />
  <path d="M 72 376 L 72 440 L 136 440" fill="none" stroke="#ff3030" stroke-width="12" stroke-linecap="square" />
  <path d="M 440 376 L 440 440 L 376 440" fill="none" stroke="#ff3030" stroke-width="12" stroke-linecap="square" />

  <!-- Outer Diamond Data Lines -->
  <polygon points="256,96 416,256 256,416 96,256" fill="none" stroke="rgba(255, 48, 48, 0.4)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Inner P2P Node Connections -->
  <line x1="256" y1="160" x2="352" y2="256" stroke="#ff3030" stroke-width="10" filter="url(#glow)" />
  <line x1="352" y1="256" x2="256" y2="352" stroke="#ff3030" stroke-width="10" filter="url(#glow)" />
  <line x1="256" y1="352" x2="160" y2="256" stroke="#ff3030" stroke-width="10" filter="url(#glow)" />
  <line x1="160" y1="256" x2="256" y2="160" stroke="#ff3030" stroke-width="10" filter="url(#glow)" />

  <!-- Crosshair Axis Lines -->
  <line x1="256" y1="120" x2="256" y2="392" stroke="rgba(255, 48, 48, 0.3)" stroke-width="6" />
  <line x1="120" y1="256" x2="392" y2="256" stroke="rgba(255, 48, 48, 0.3)" stroke-width="6" />

  <!-- P2P Vertices (Nodes) -->
  <circle cx="256" cy="160" r="18" fill="#ffffff" stroke="#ff3030" stroke-width="6" filter="url(#glow)" />
  <circle cx="352" cy="256" r="18" fill="#ffffff" stroke="#ff3030" stroke-width="6" filter="url(#glow)" />
  <circle cx="256" cy="352" r="18" fill="#ffffff" stroke="#ff3030" stroke-width="6" filter="url(#glow)" />
  <circle cx="160" cy="256" r="18" fill="#ffffff" stroke="#ff3030" stroke-width="6" filter="url(#glow)" />

  <!-- Center Primary Signal Core -->
  <circle cx="256" cy="256" r="32" fill="#ff3030" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
