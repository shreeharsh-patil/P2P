<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171126" />
      <stop offset="100%" stop-color="#0b0912" />
    </linearGradient>

    <linearGradient id="duskAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f27494" />
      <stop offset="55%" stop-color="#f39470" />
      <stop offset="100%" stop-color="#6be0eb" />
    </linearGradient>

    <radialGradient id="duskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f27494" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#7c3aed" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0b0912" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="8" />
  <circle cx="256" cy="256" r="190" fill="url(#duskGlow)" />

  <polygon points="256,98 414,256 256,414 98,256" fill="none" stroke="rgba(242,116,148,0.28)" stroke-width="6" stroke-dasharray="14 12" />

  <line x1="256" y1="156" x2="356" y2="256" stroke="url(#duskAccent)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="356" y1="256" x2="256" y2="356" stroke="url(#duskAccent)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="256" y1="356" x2="156" y2="256" stroke="url(#duskAccent)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)" />
  <line x1="156" y1="256" x2="256" y2="156" stroke="url(#duskAccent)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)" />

  <line x1="256" y1="120" x2="256" y2="392" stroke="rgba(107,224,235,0.22)" stroke-width="5" />
  <line x1="120" y1="256" x2="392" y2="256" stroke="rgba(242,116,148,0.22)" stroke-width="5" />

  <circle cx="256" cy="156" r="18" fill="#f5f2f7" stroke="#f27494" stroke-width="6" />
  <circle cx="356" cy="256" r="18" fill="#f5f2f7" stroke="#f39470" stroke-width="6" />
  <circle cx="256" cy="356" r="18" fill="#f5f2f7" stroke="#6be0eb" stroke-width="6" />
  <circle cx="156" cy="256" r="18" fill="#f5f2f7" stroke="#f27494" stroke-width="6" />

  <circle cx="256" cy="256" r="30" fill="url(#duskAccent)" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />
</svg>
