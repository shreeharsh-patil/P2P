version: '3.8'

services:
  shree-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shree_p2p_app
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - TURN_SERVER=turn:coturn:3478
      - TURN_USERNAME=shreeuser
      - TURN_PASSWORD=shreesecret
    depends_on:
      - coturn
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: shree_coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49152
      - --max-port=49200
      - --realm=shree.local
      - --user=shreeuser:shreesecret
      - --lt-cred-mech
      - --fingerprint
